  carrera: "Ingeniería Mecánica"
  correo: "lriano@unal.edu.co"
  foto: "/assets/images/miembros/default.jpg"
  descripcion: "Estudiante de Ingeniería Mecánica enfocado en el análisis de fenómenos de fragilización por hidrógeno en materiales mediante modelos avanzados como Phase Field Damage Model (PFDM), Hydrogen Enhanced Decohesion (HEDE) y Hydrogen Enhanced Localized Plasticity (HELP). Ha trabajado en la caracterización de inyectores mediante simulación por elementos finitos utilizando OpenFOAM. Cuenta con participación en congresos internacionales como el Mars Society Convention (2019), CATE (2021) y CEC (2023), además de experiencia en diseño de misiones análogas como oficial de control en entornos simulados."